<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RSS Reader</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="RSS Reader" />
    <meta name="description" content="自托管 RSS 阅读器" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 静态声明 black-translucent：页面延伸至状态栏下方，状态栏背景由 theme-color 决定，
         文字颜色由系统按亮度自动适配（Safari 15.4+），从而跟随应用主题切换。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RSS Reader" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      const theme = localStorage.getItem('rss-theme') || 'auto';
      const isDark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      // black-translucent 状态栏下页面首帧即延伸到屏幕顶部，需在渲染前识别独立模式，
      // 供 safe-area 样式（.ios-pwa-standalone）避免内容被状态栏遮挡或布局闪跳。
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add('ios-pwa-standalone');
      }
      // auto 保留两组媒体主题色，系统可直接切换；手动主题让两组都使用选定颜色。
      if (theme !== 'auto') {
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.content = isDark ? '#202124' : '#FFFFFF';
        });
      }
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      html, body { margin: 0; background: #F7F8FA; }
      html.dark, html.dark body { background: #17181A; }
      .startup-shell { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .startup-placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .startup-icon { width: 48px; height: 48px; border-radius: 16px; background: #3478F633; }
      .startup-line { width: 96px; height: 12px; border-radius: 999px; background: #E8EBF0; }
      html.dark .startup-line { background: #33363D; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-shell" role="status" aria-label="正在加载 RSS Reader">
        <div class="startup-placeholder" aria-hidden="true">
          <div class="startup-icon"></div>
          <div class="startup-line"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
