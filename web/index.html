<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RSS Reader</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="RSS Reader" />
    <meta name="description" content="自托管 RSS 阅读器" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RSS Reader" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      const theme = localStorage.getItem('rss-theme') || 'auto';
      const isDark = theme === 'dark' || (theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#202124' : '#FFFFFF';
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = isDark ? 'black-translucent' : 'default';
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
